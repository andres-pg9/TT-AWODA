[pytest]
# Configuración de pytest para AWODA Backend

# Ruta base del proyecto (permite imports relativos)
pythonpath = .

# Directorio donde buscar tests
testpaths = tests

# Patrones de archivos/funciones/clases de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers personalizados
markers =
    unit: Pruebas unitarias de lógica de negocio
    ia: Pruebas del módulo de Inteligencia Artificial
    normalizacion: Pruebas de funciones de normalización
    pso: Pruebas del algoritmo PSO
    heuristica: Pruebas de funciones heurísticas
    slow: Pruebas que tardan más de 1 segundo

# Opciones de salida
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes

# Configuración de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
